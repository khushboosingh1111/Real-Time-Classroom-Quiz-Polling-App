# ============================================
# QuizMaster Live - Application Configuration
# ============================================

server.port=8081

# --- H2 In-Memory DB for Demo (swap to MySQL for prod) ---
spring.datasource.url=jdbc:h2:mem:quizdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- MySQL Production Config (uncomment for prod) ---
# spring.datasource.url=jdbc:mysql://localhost:3306/quizmaster?useSSL=false&serverTimezone=UTC
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- CORS ---
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173
